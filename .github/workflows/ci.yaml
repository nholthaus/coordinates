name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Primary build/test matrix.
  #
  # Preserves the original three compiler entries (windows-msvc, ubuntu-gcc,
  # ubuntu-clang-19) and multiplies them across Release and Debug.
  # -DCOORDINATES_WARNINGS_AS_ERRORS=ON turns on warnings-as-errors on this
  # project's own targets only (applied via target_compile_options, so compiler
  # defaults such as MSVC /EHsc are preserved and third-party headers like units
  # are not held to our warning level). Downstream consumers are unaffected.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Release ---
          - name: windows-msvc
            os: windows-latest
            c_compiler: cl
            cxx_compiler: cl
            config: Release

          - name: ubuntu-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
            config: Release

          - name: ubuntu-clang-19
            os: ubuntu-latest
            c_compiler: clang-19
            cxx_compiler: clang++-19
            config: Release

          # --- Debug ---
          - name: windows-msvc
            os: windows-latest
            c_compiler: cl
            cxx_compiler: cl
            config: Debug

          - name: ubuntu-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
            config: Debug

          - name: ubuntu-clang-19
            os: ubuntu-latest
            c_compiler: clang-19
            cxx_compiler: clang++-19
            config: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ensures a modern CMake (and can provide Ninja as well).
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ">=3.28.0"

      - name: Install Clang (Ubuntu only)
        if: matrix.name == 'ubuntu-clang-19'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-tools-19 llvm-19-tools ninja-build

      # Required when using cl.exe with Ninja on windows
      - name: Setup MSVC dev cmd
        if: matrix.name == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DCOORDINATES_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer build.
  #
  # A standalone job (not a matrix row) so the sanitizer flags never bleed into
  # the primary matrix. Sanitizer flags are applied to both the compile and the
  # link/exe stages so the instrumented runtime is pulled in correctly.
  # ---------------------------------------------------------------------------
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ">=3.28.0"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Feature-toggle build.
  #
  # Proves the feature knobs compile in a non-default state. DTED is turned OFF
  # with BOTH DTED and GEOIDS off. In that configuration the library has no .cpp
  # translation units (all sources are guarded behind those options); the target
  # sets LINKER_LANGUAGE CXX so CMake can still link the (header-only) library.
  # ---------------------------------------------------------------------------
  feature-toggles:
    name: feature-toggles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ">=3.28.0"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCOORDINATES_ENABLE_DTED=OFF \
            -DCOORDINATES_ENABLE_GEOIDS=OFF

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Install-smoke consumer build.
  #
  # Installs `units` and `coordinates` into a shared prefix, then configures a
  # tiny throwaway consumer project that does find_package(coordinates CONFIG
  # REQUIRED), links coordinates::coordinates, and compiles a .cpp that includes
  # the umbrella <coordinates.h> and instantiates + converts an LLA to an ECEF.
  # This proves the installed package's headers and config files are complete.
  #
  # units must be findable by the consumer too: coordinatesConfig.cmake calls
  # find_dependency(units 3.5.1 CONFIG). We install units into the same prefix
  # up front so both coordinates' build and the consumer's find_package resolve
  # it from CMAKE_PREFIX_PATH (no FetchContent needed downstream).
  # ---------------------------------------------------------------------------
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ">=3.28.0"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build git

      # Build + install the units dependency (v3.5.1, the same tag the repo's
      # FetchContent fallback pins) into the shared prefix so find_package(units)
      # resolves for both the coordinates build and the consumer.
      - name: Build and install units
        shell: bash
        run: |
          git clone --depth 1 --branch v3.5.1 https://github.com/nholthaus/units.git units-src
          cmake -S units-src -B units-build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCS=OFF
          cmake --build units-build --parallel
          cmake --install units-build --prefix "$PWD/_install"

      - name: Configure and build coordinates
        shell: bash
        run: |
          cmake -S . -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCOORDINATES_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build build --parallel

      - name: Install coordinates
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/_install"

      - name: Generate throwaway consumer project
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(coordinates_consumer LANGUAGES CXX)

          find_package(coordinates CONFIG REQUIRED)

          add_executable(consumer main.cpp)
          target_compile_features(consumer PRIVATE cxx_std_23)
          target_link_libraries(consumer PRIVATE coordinates::coordinates)
          EOF

          cat > consumer/main.cpp <<'EOF'
          #include <coordinates.h>

          int main()
          {
              // Instantiate an LLA and convert it to an ECEF. The implicit
              // conversion constructor routes through coordinates::convert,
              // exercising the installed umbrella header end to end.
              coordinates::LLA  lla;
              coordinates::ECEF ecef = lla;
              (void) ecef;
              return 0;
          }
          EOF

      - name: Configure and build consumer
        shell: bash
        run: |
          cmake -S consumer -B consumer/build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build consumer/build --parallel

      - name: Run consumer
        shell: bash
        run: |
          ./consumer/build/consumer
